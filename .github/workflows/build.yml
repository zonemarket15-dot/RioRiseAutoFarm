name: Rio Rise AutoFarm APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: |
          unzip -o RioRiseAutoFarm-cloud.zip -d proyecto
          echo "Archivos Gradle encontrados:"
          find proyecto -type f \( -name build.gradle -o -name build.gradle.kts -o -name settings.gradle -o -name settings.gradle.kts \)

      - name: Compilar APK
        run: |
          PROYECTO=$(find proyecto -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          if [ -z "$PROYECTO" ]; then
            echo "ERROR: No se encontró settings.gradle en el ZIP."
            exit 1
          fi
          cd "$PROYECTO"
          gradle --no-daemon assembleDebug

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RioRiseAutoFarm-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
